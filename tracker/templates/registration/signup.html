{% extends 'tracker/base.html' %}

{% block title %}Signup - Holdin{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Create your account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Signup</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
